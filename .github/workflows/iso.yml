name: ISO observations (baseline)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LogtalkDotOrg/logtalk3
          ref: bba0882757af2fc10bf5d3523ad84eb93c96dc30
          path: upstream-logtalk
          persist-credentials: false
      - name: Install test runtimes
        run: sudo apt-get update && sudo apt-get install -y sbcl swi-prolog-nox
      - name: Test the importer, isolation and result classification
        run: python3 -m unittest discover -s tests/iso -p 'test_*.py' -v
      - name: Run every selected upstream ISO definition and compare observations
        run: python3 tests/iso/run.py --upstream upstream-logtalk --baseline tests/iso/baseline.json --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-observations
          path: iso-results/
          if-no-files-found: warn
