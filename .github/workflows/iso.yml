name: ISO observations (baseline)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtimes
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Test isolation and result classification
        run: python3 -m unittest discover -s tests/iso -p 'test_*.py' -v
      - name: Run bundled ISO checks offline and compare observations
        run: python3 tests/iso/run.py --baseline tests/iso/baseline.json --strict --jobs 2
      - name: Run strict term model without expected differences
        run: python3 tests/iso/run.py --term-model iso --strict --jobs 2 --output iso-results-strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-observations
          path: |
            iso-results/
            iso-results-strict/
          if-no-files-found: warn
